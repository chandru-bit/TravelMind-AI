events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log custom_format;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream cluster for API Gateway (Round-robin load balancing)
    upstream api_gateway_cluster {
        server api-gateway:8000;
    }

    # Upstream cluster for Frontend
    upstream frontend_cluster {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static / App Routing
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway Proxying
        location /api/ {
            proxy_pass http://api_gateway_cluster/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Nginx Health Check Endpoint
        location /nginx-health {
            return 200 '{"status":"healthy","service":"nginx-load-balancer"}';
            add_header Content-Type application/json;
        }
    }
}
