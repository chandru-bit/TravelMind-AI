version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travelmind-postgres
    environment:
      POSTGRES_DB: travelmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelmind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: travelmind-user-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-key-travelmind-ai-2026-production-grad
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: travelmind-trip-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-key-travelmind-ai-2026-production-grad
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    container_name: travelmind-recommendation-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-key-travelmind-ai-2026-production-grad
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    container_name: travelmind-prediction-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: travelmind-ai-service
    environment:
      - DEMO_MODE=true
      - LLM_API_KEY=
      - LLM_MODEL=gpt-4o-mini

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: travelmind-notification-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-key-travelmind-ai-2026-production-grad
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: travelmind-api-gateway
    environment:
      - USER_SERVICE_URL=http://user-service:8000
      - TRIP_SERVICE_URL=http://trip-service:8000
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8000
      - AI_SERVICE_URL=http://ai-service:8000
      - PREDICTION_SERVICE_URL=http://prediction-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - user-service
      - trip-service
      - recommendation-service
      - ai-service
      - prediction-service
      - notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelmind-frontend

  nginx:
    image: nginx:alpine
    container_name: travelmind-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend

volumes:
  postgres_data:
